# Local development services for Plinth. Not used in production —
# prod runs Neon (Postgres), Upstash (Redis REST), Inngest Cloud, and Cloudflare R2.
#
#   docker compose -f docker-compose.dev.yml up -d --wait
#
# (Or just `./scripts/dev-setup.sh`, which does that plus env + deps + migrate.)
#
# Ports (mirrored in .env.example):
#   5433  Postgres            9000  S3 API (versitygw, R2-compatible)
#   6379  Redis               9001  S3 web UI
#   8079  Upstash-REST proxy  8288  Inngest dev server UI

name: plinth-dev

# No restart policies, deliberately: the stack starts on demand from the
# `pnpm dev` preflight (scripts/dev-preflight.sh) and stays down otherwise.
# Resident services would squat default ports (redis 6379, s3 9000/9001)
# on a multi-project machine every time Docker starts — the same collision
# class that forced postgres off 5432. Docker-restart amnesia is harmless
# here: the next `pnpm dev` just starts the services again.

services:
  postgres:
    # Matches Neon's default major. Production floor is ≥16 (README stack table).
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: plinth
      POSTGRES_PASSWORD: plinth
      POSTGRES_DB: plinth
    ports:
      # Host 5433, not 5432: a host-level Postgres (Homebrew, Postgres.app)
      # binds 127.0.0.1:5432 and shadows a Docker wildcard publish for every
      # localhost connection — the classic silent "wrong server" failure.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plinth -d plinth"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Upstash is a REST API, not the Redis wire protocol. SRH (serverless-redis-http)
  # emulates Upstash's REST surface in front of a real Redis, so the same
  # @upstash/* client code runs against UPSTASH_REDIS_REST_URL=http://localhost:8079.
  redis:
    # Pinned to 7: closest to Upstash's Redis-compatible API; emulation > latest here.
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  upstash-proxy:
    image: hiett/serverless-redis-http:latest@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

  inngest:
    # The un-versioned upstreams (inngest, srh) are digest-pinned so dev and CI
    # stay reproducible; Renovate bumps the digests. postgres, redis and the
    # S3 gateway keep semantic version tags.
    image: inngest/inngest:latest@sha256:ad551e89e493e34db74d155be37dc5549930fcb6eb8382e502c17da9762821c7
    command: "inngest dev -u http://host.docker.internal:4000/api/inngest --no-discovery"
    ports:
      - "8288:8288"
    extra_hosts:
      # host-gateway makes host.docker.internal work on Linux too (native on Mac/Win).
      - "host.docker.internal:host-gateway"

  # versitygw, not MinIO. MinIO withdrew its community images: the Docker Hub
  # repositories stopped answering in September, the quay.io ones a few weeks
  # later, and the upstream repositories are archived — each re-point at
  # another registry only bought time, and broke the e2e job's dev services on
  # every pull request in between. versitygw is a maintained S3 gateway that
  # publishes its own versioned images and checks request signatures, which a
  # mock would not.
  #
  # Its POSIX backend serves every top-level directory of /data as a bucket,
  # so the three buckets the app expects (media, sites, backups per ADR-0011)
  # are a mkdir ahead of the gateway rather than a one-shot client container:
  # `up -d --wait` is the whole bootstrap, and re-running it is idempotent.
  #
  # VGW_REGION matches what the api signs with (apps/api/src/lib/s3.ts). R2
  # ignores the region; a gateway that verifies signatures does not.
  s3:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p /data/plinth-media /data/plinth-sites /data/plinth-backups
        && exec /usr/local/bin/docker-entrypoint.sh
    environment:
      ROOT_ACCESS_KEY: plinth
      ROOT_SECRET_KEY: plinth-local-dev
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
      VGW_REGION: auto
      # /_/health: an unauthenticated 200 for the healthcheck below, on a path
      # no bucket name can collide with. The web UI is a browser app that signs
      # its own requests, so it has to be told where the host reaches the
      # gateway and be allowed to call it cross-origin.
      VGW_ARGS: >-
        --port :9000
        --health /_/health
        --webui :9001
        --webui-gateways http://localhost:9000
        --cors-allow-origin http://localhost:9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/_/health"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  s3-data:
