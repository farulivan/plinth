packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency build scripts by default (supply-chain safety); each
# entry is an explicit decision.
#   unrs-resolver: native module resolver for eslint-plugin-import-x — must build.
#   lefthook: its postinstall only runs `lefthook install`, which our root
#     `prepare` script already does — so decline the build (the binary itself
#     comes from the platform optional-dependency, no build needed).
#   esbuild: installs its platform binary at postinstall (pulled by drizzle-kit).
#   cpu-features + ssh2 (via testcontainers): optional native crypto acceleration;
#     both fall back to pure JS, so decline the builds.
#   protobufjs (via testcontainers): postinstall is codegen we never consume — decline.
#   sharp (via next's image optimizer + ADR-0006 media pipeline on apps/api):
#     native libvips bindings — must build, we use it on both counts.
#   @sentry/cli (via @sentry/nextjs): downloads the sentry-cli binary used to
#     upload source maps at build time (CI/prod) — allow the build.
#   workerd (via wrangler + vitest-pool-workers): installs the Workers runtime
#     binary — wrangler dev and the worker-router tests need it.
allowBuilds:
  "@sentry/cli": true
  cpu-features: false
  esbuild: true
  lefthook: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
  workerd: true

# This project deliberately tracks latest-stable releases (see the version policy
# in README.md), so we opt out of pnpm's new-release age gating — otherwise fresh
# majors (ESLint 10, TS 6, …) get held back and pnpm churns an auto-exclude list.
# Reintroduce a non-zero age once the dependency set stabilizes post-MVP.
minimumReleaseAge: 0

# Overrides hold a transitive package at a patched release when one exists.
# Each entry carries its reason and is retired by hand once the parent catches
# up, which is why renovate.json tells Renovate to leave this block alone.
overrides:
  # Every copy of sharp, whoever pulls it, is held to the patched line. Astro
  # and Next carry it as an optional dependency for image work this codebase
  # never asks for — nothing uses astro:assets, and the dashboard never imports
  # next/image or configures `images` — and wrangler's miniflare keeps a third
  # for local image emulation. Astro declares "^0.34.0 || ^0.35.0" and
  # miniflare 0.35.2, so 0.35.4 sits inside both; Next declares "^0.34.5" and
  # this steps past it deliberately, since shipping a high-severity advisory in
  # a runtime image to respect a caret on a dependency nothing calls is the
  # worse trade. Revisit if next/image is ever adopted. 0.35.4 is the floor for
  # the libheif fixes (GHSA-rgj7-g3m4-5g8c, GHSA-g89c-p67h-r497,
  # GHSA-2jg2-4ch7-h545), the release the api's own sharp already takes for its
  # upload pipeline. One blanket entry replaces the per-parent pair, which
  # missed miniflare — dependency review caught that the first time wrangler
  # moved.
  sharp: "^0.35.4"

  # Transitive advisories with no reachable first-party call, each pinned to
  # the first patched release rather than added to the accepted list below —
  # the fix exists, so accepting the advisory would be choosing to ship it.
  #
  # postcss (GHSA-fxqj-rqcc-2cmp): an incomplete fix for one of the source-map
  # advisories already accepted below. Reached through Tailwind at build time
  # and never given untrusted CSS, but 8.5.25 is a patch release on a range we
  # already float.
  postcss: "^8.5.25"
  # fast-uri (GHSA-7p8r-x3mc-p8w7, plus the 3.1.6 batch — 5jgf-p345-68v8,
  # f65p-4m7j-42xc, fph4-wmhf-6fwf, jqff-g426-hqxp): host confusion and SSRF
  # in URI normalization, via ajv in commitlint's config loader, Astro's
  # language server, and webpack's schema-utils under @sentry/nextjs. All are
  # SSRF-flavored and this tree never asks ajv to make an access decision
  # from a URI, but 3.1.6 patches inside the 3.x line the tree already
  # resolves, so there is nothing to weigh up.
  fast-uri: "^3.1.6"
  # browserslist (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g): unbounded memory
  # growth on distinct queries, and a prototype write through an untrusted
  # browserslist-stats.json. Reached at build time only — Babel under the
  # Sentry bundler plugins and @vitejs/plugin-react, and webpack under
  # @sentry/webpack-plugin — and nothing here feeds it a stats file it did
  # not write. 4.28.7 is a patch on the 4.x line every parent already
  # declares; an override touches the single lockfile entry.
  browserslist: "^4.28.7"
  # brace-expansion (GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg,
  # GHSA-rgw5-rvv9-x895): DoS on untrusted glob patterns, and a bypass of the
  # first mitigation. Three lines resolve here — 1.x through the minimatch that
  # eslint, its config-array and eslint-plugin-react still use, 2.x under
  # inngest's OpenTelemetry chain, and the 4.x/5.x line under glob. Each takes
  # the first patched release inside what its parent declares; minimatch asks
  # for ^1.1.7, so 1.1.18 sits inside it. The 5.0.9 pin is the exception,
  # crossing a major on a package whose whole surface is one glob-expansion
  # function, because that line has no patch below 5.
  brace-expansion@1: "^1.1.18"
  brace-expansion@2: "^2.1.4"
  brace-expansion@>=4: "^5.0.9"
  # js-yaml (GHSA-5p4m-2wfm-xmqj): quadratic CPU resolving `!!omap`, and the
  # CVE-2026-59870 fix was not backported below 4.3.1. Two copies resolve
  # today. Astro itself already pulls the patched one through
  # @astrojs/internal-helpers 0.10.2; @astrojs/react pins that helper at
  # exactly 0.10.1, whose `js-yaml: ^4.1.1` floats back to 4.2.0. Pinning the
  # leaf rather than the helper keeps this inside every declared range —
  # 4.3.1 satisfies both ^4.1.1 and ^4.3.0 — where overriding the helper would
  # step past an exact pin. It also dedupes the tree to one copy. The floor
  # moved to 4.3.2 for GHSA-2883-xcg3-v3hh (maxTotalMergeKeys left CPU on empty
  # merge sources unbounded), still inside both declared ranges.
  js-yaml: "^4.3.2"
  # nanoid (GHSA-2v37-7h3g-55p8): a custom alphabet plus a size of zero spins
  # forever. Reached only through postcss, which is itself only reached by
  # Tailwind at build time, and nothing here calls nanoid at all — but the
  # patch is a patch release inside the range postcss already declares
  # (^3.3.16), so there is nothing to weigh up.
  #
  # Pinned rather than resolved by `pnpm update`, which is the tempting fix
  # and the wrong one: bumping the leaf re-resolves every parent that depends
  # on it, and here that cascaded into vite, vitest, astro, better-auth and
  # the whole lightningcss platform set — 53 packages moved to patch one. An
  # override touches the single entry it names.
  nanoid: "^3.3.18"
  # smol-toml (GHSA-7w5x-hrqm-74c2): a malformed TOML document can hang the
  # parser. Reached through @astrojs/internal-helpers at build time, and
  # nothing here hands it tenant-authored TOML. The patched line sits inside
  # the ^1.6.0 the helper declares; the astro bump alone left 1.7.0 locked.
  smol-toml: "^1.7.1"
  # svgo (GHSA-w27v-7q3p-w38r, GHSA-4vpr-x523-8j87): removeScripts lets
  # executable links and foreignObject HTML through. Reached through Astro at
  # build time, on the templates' own SVGs — uploads accept only JPEG, PNG,
  # WebP and AVIF. 4.1.0 is inside the ^4.0.1 Astro declares; the astro bump
  # alone left 4.0.2 locked.
  svgo: "^4.1.0"
  # protobufjs (GHSA-j3f2-48v5-ccww): reached only through @grpc/proto-loader
  # and dockerode, which testcontainers uses to run the RLS probe's Postgres
  # (ADR-0002), and never built into an image. It sat on the accepted list
  # until 7.6.5 shipped — a patch inside the ^7.5.5 and ^7.3.2 those parents
  # declare, which makes it a pin like the rest.
  protobufjs: "^7.6.5"

# `pnpm audit --prod` runs as a CI gate (.github/workflows/ci.yml). These are
# the advisories standing at the time the gate landed, each accepted with a
# reason rather than a blanket severity threshold — the point of the gate is
# that anything NOT on this list fails the build, which is what a new advisory
# on hono, better-auth, next, drizzle or zod would do.
#
# Every entry below is build- or test-toolchain. They are genuinely present in
# the api image, which ships the pruned workspace so the publish job can shell
# out to `astro build` (ADR-0013) — presence is not the question, reachability
# is. None sits on a request path, and each needs attacker-controlled input to
# a tool that only ever sees first-party code: templates and Astro config we
# wrote, plus a content snapshot already validated by @plinth/schema. Tenants
# author content, never CSS, YAML, globs or build config.
#
# Re-check an entry when the package moves onto a request path, not on a
# schedule. Drop it when the upstream fix lands — Renovate raises those.
auditConfig:
  ignoreGhsas:
    # postcss — via @tailwindcss/postcss and @tailwindcss/vite at build time.
    # Source-map file read, path traversal, and XSS through an unescaped
    # </style>; all need untrusted CSS, and the only CSS here is ours.
    - GHSA-6g55-p6wh-862q
    - GHSA-r28c-9q8g-f849
    - GHSA-qx2v-qp2m-jg93
    # esbuild — via vite, vitest and tsx. Both advisories are about esbuild's
    # dev server accepting cross-origin requests; nothing runs `esbuild serve`,
    # in CI or in either image.
    - GHSA-g7r4-m6w7-qqqr
    - GHSA-67mh-4wv8-2f99
    # fast-uri — via ajv, itself pulled by commitlint's config validator.
    # Host confusion in URI parsing, which matters to a URI-based access
    # decision; ajv here validates a JSON schema at lint time.
    - GHSA-v2hh-gcrm-f6hx
    - GHSA-4c8g-83qw-93j6
