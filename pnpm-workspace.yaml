packages:
  - "apps/*"
  - "packages/*"

# pnpm blocks dependency build scripts by default (supply-chain safety); each
# entry is an explicit decision.
#   unrs-resolver: native module resolver for eslint-plugin-import-x — must build.
#   lefthook: its postinstall only runs `lefthook install`, which our root
#     `prepare` script already does — so decline the build (the binary itself
#     comes from the platform optional-dependency, no build needed).
#   esbuild: installs its platform binary at postinstall (pulled by drizzle-kit).
#   cpu-features + ssh2 (via testcontainers): optional native crypto acceleration;
#     both fall back to pure JS, so decline the builds.
#   protobufjs (via testcontainers): postinstall is codegen we never consume — decline.
allowBuilds:
  cpu-features: false
  esbuild: true
  lefthook: false
  protobufjs: false
  ssh2: false
  unrs-resolver: true

# This project deliberately tracks latest-stable releases (see the version policy
# in README.md), so we opt out of pnpm's new-release age gating — otherwise fresh
# majors (ESLint 10, TS 6, …) get held back and pnpm churns an auto-exclude list.
# Reintroduce a non-zero age once the dependency set stabilizes post-MVP.
minimumReleaseAge: 0
