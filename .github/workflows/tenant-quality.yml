name: Tenant quality

# Performance, a11y and bundle budgets on the output tenants actually receive.
# Every other lane audits the dashboard or the api; nothing held the published
# site to a bar until this one. It builds the committed example-content fixture
# through the real publish-time toolchain (ADR-0013) with no Postgres, R2 or
# Inngest in the loop.
#
# Blocking, as of the content port. The budgets are the bar the first tenant's
# standalone site set for itself, and this build now clears all of them across
# every route: Lighthouse 1.0 for performance, accessibility, best-practices
# and SEO on all six audited URLs. It was reporting-only while that was still
# a set of tracked deltas; keeping it advisory now would mean a regression
# could land without anyone noticing.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/site-builder/**"
      - "packages/template-norven/**"
      - "packages/renderer/**"
      - "packages/schema/**"
      - "scripts/build-tenant-fixture.sh"
      - "scripts/check-bundle-budget.mjs"
      - "bundle-budget.json"
      - ".lighthouserc.tenant.json"
      - ".github/workflows/tenant-quality.yml"

concurrency:
  group: tenant-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tenant:
    name: tenant budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A `client:` directive would hydrate a renderer component and pull
      # Astro's React runtime into the page — ~190 KB the tenant does not pay
      # for today. Cheaper to catch here than in a bundle diff.
      - name: assert no client-side hydration
        run: |
          if grep -rn 'client:' packages/site-builder/src; then
            echo "::error::A client: directive would ship React to tenant sites — see ADR-0003."
            exit 1
          fi
          echo "No client: directives — tenant sites stay server-rendered."

      - run: pnpm tenant:build

      # Branding is the one part of the head that no other gate covers.
      # Lighthouse does not fail a missing favicon, the bundle budget measures
      # only JS and CSS, and axe has nothing to say about a manifest — so a
      # build that shipped no icons at all, or shipped the framework
      # scaffold's, would pass every other check on this lane.
      - name: assert the tenant carries its own branding
        run: |
          for f in favicon.svg favicon.ico apple-touch-icon.png \
                   icon-192.png icon-512.png icon-512-maskable.png site.webmanifest; do
            if [ ! -s ".tenant-fixture/$f" ]; then
              echo "::error::$f is missing from the tenant build — check the template's public/."
              exit 1
            fi
          done
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const m = JSON.parse(readFileSync(".tenant-fixture/site.webmanifest", "utf8"));
            if (!m.name) throw new Error("manifest has no name — the site name did not reach it");
            if (!m.icons?.length) throw new Error("manifest declares no icons");
          '
          echo "Tenant branding present: 6 icons and a manifest naming the site."

      - run: pnpm check:bundle

      - name: lhci
        run: pnpm dlx @lhci/cli@latest autorun --config=.lighthouserc.tenant.json
