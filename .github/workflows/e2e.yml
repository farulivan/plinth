name: E2E + a11y

# Built but disabled. Playwright E2E + axe a11y against the dashboard. The
# Playwright setup (deps, config, the `test:e2e` script, and specs under
# tests/e2e/) lands with the editor slice — until then this is dispatch-only and
# a manual run fails at the missing script. Flip on by uncommenting pull_request.
on:
  workflow_dispatch:
  # pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: playwright + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
