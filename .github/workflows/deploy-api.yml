name: Deploy api

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  contents: read

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --ignore-scripts: migrations run drizzle-kit + node-postgres, both pure
      # JS — no reason to pay for Sharp's/workerd's native postinstall builds
      # just to apply a migration.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # ADR-0011: migrations land before the new image takes traffic. This
      # step gates the deploy job below — a failed migration never reaches
      # `flyctl deploy`, so the old version keeps serving.
      - run: pnpm --filter @plinth/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: deploy
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      # App-scoped deploy token (`fly tokens create deploy -a plinth-farulivan-api`), stored
      # as a repo secret — least privilege, not an account token. Builds on Fly's
      # remote builders, so the runner needs no Docker and the whole monorepo is
      # the context the Dockerfile's `turbo prune` expects.
      # The trailing `.` sets the build context to the repo root — the
      # Dockerfile's `turbo prune` needs the whole workspace, and flyctl
      # otherwise anchors the context to the --config file's directory.
      - run: flyctl deploy . --config apps/api/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_API }}
