name: CodeQL

# Static security analysis (findings land in the repo's Security tab). Extract
# is source-based — no build — so it's cheap enough to gate PRs: it runs on
# every PR and push to main, with a weekly scheduled sweep as the backstop for
# rules that only ship in newer CodeQL releases.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read # required for private repos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # One combined analysis covers the whole TS/JS monorepo; CodeQL extracts
      # from source, so no build step is needed.
      - uses: github/codeql-action/init@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3
        with:
          category: "/language:javascript-typescript"
