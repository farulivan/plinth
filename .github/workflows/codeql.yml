name: CodeQL

# Static security analysis (findings land in the repo's Security tab). Extract
# is source-based — no build — so it's cheap enough to gate PRs: it runs on
# every PR and push to main, with a weekly scheduled sweep as the backstop for
# rules that only ship in newer CodeQL releases.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      actions: read # required for private repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # One combined analysis covers the whole TS/JS monorepo; CodeQL extracts
      # from source, so no build step is needed.
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:javascript-typescript"
