name: Lighthouse

# Performance + a11y budgets on the dashboard (the public /login for now; more
# routes as the editor lands). Budgets live in .lighthouserc.json.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "packages/ui/**"
      - "packages/renderer/**"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse.yml"

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: lhci
    runs-on: ubuntu-latest
    env:
      # Build + serve without real secrets; the audited /login needs none.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plinth/dashboard build
      - run: pnpm dlx @lhci/cli@latest autorun
