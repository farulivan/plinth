name: Lighthouse

# Performance + a11y budgets on the dashboard (the public /login for now; more
# routes as the editor lands). Budgets live in .lighthouserc.json.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "packages/ui/**"
      - "packages/renderer/**"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse.yml"

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    name: lhci
    runs-on: ubuntu-latest
    env:
      # Build + serve without real secrets; the audited /login needs none.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plinth/dashboard build
      - run: pnpm dlx @lhci/cli@latest autorun
