name: Deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - ".github/workflows/deploy-dashboard.yml"

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      # App-scoped deploy token (`fly tokens create deploy -a plinth-farulivan-dashboard`),
      # stored as a repo secret. Remote build on Fly; server secrets live in
      # `fly secrets`. The client Sentry DSN is a public build arg (inlined at
      # build) — pass it as a repo variable so it ships to the browser bundle.
      # The leading `.` sets the build context to the repo root — the
      # Dockerfile's `turbo prune` needs the whole workspace, and flyctl
      # otherwise anchors the context to the --config file's directory.
      - run: >
          flyctl deploy . --config apps/dashboard/fly.toml --remote-only
          --build-arg NEXT_PUBLIC_SENTRY_DSN_DASHBOARD=${{ vars.NEXT_PUBLIC_SENTRY_DSN_DASHBOARD }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN_DASHBOARD }}
