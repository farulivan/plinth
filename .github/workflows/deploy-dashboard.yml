name: Deploy dashboard

# Built but disabled. Skeletons aren't worth deploying, and this needs a Fly
# deploy token configured first. Runnable via "Run workflow" to prove it's wired;
# flip on by uncommenting the push trigger once the product is demo-ready.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/dashboard/**"
  #     - "packages/**"
  #     - ".github/workflows/deploy-dashboard.yml"

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false # never cancel a deploy mid-flight

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # App-scoped deploy token (`fly tokens create deploy -a plinth-dashboard`),
      # stored as a repo secret. Remote build on Fly; server secrets live in
      # `fly secrets`. The client Sentry DSN is a public build arg (inlined at
      # build) — pass it as a repo variable so it ships to the browser bundle.
      - run: >
          flyctl deploy --config apps/dashboard/fly.toml --remote-only
          --build-arg NEXT_PUBLIC_SENTRY_DSN_DASHBOARD=${{ vars.NEXT_PUBLIC_SENTRY_DSN_DASHBOARD }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_DASHBOARD }}
