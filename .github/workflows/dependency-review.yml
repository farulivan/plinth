name: Dependency review

# The complement to audit.yml. That one asks "is the dependency graph clean
# right now", against a baseline of accepted advisories, and runs on main;
# this one asks "does this PR make it worse", by diffing the manifests against
# the base branch, and is the supply-chain gate a pull request sees. The
# difference matters: a newly introduced vulnerable package fails here on the
# PR that adds it, with the offending dependency named, while an advisory
# published against something already locked is main's problem, not the
# next PR's.
#
# It also checks the licence of anything new — this repo is MIT, and a
# copyleft dependency arriving unnoticed is a licensing problem, not just a
# legal footnote.
on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block on high and above, let moderate report. This action does not
          # read auditConfig.ignoreGhsas, and the standing moderates there are
          # all build tooling (esbuild, postcss, fast-uri), so a lower bar
          # would fail a Renovate bump that moves one of them to a release
          # still under an advisory already accepted.
          fail-on-severity: high
          # GPL/AGPL/SSPL in a dependency of an MIT codebase is a decision
          # someone has to make deliberately, not one that lands in a lockfile.
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never # needs pull-requests:write; the job status is the gate
